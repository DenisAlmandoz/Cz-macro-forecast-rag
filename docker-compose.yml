services:
  rag:
    build: .
    image: czech-forecast-rag
    container_name: czech-forecast-rag
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # The image ships only the app; point these at a mounted host directory.
      DOCUMENTS_DIR: /app/documents
      VECTOR_STORE_DIR: /app/data/chroma
    volumes:
      # PDFs to index. Drop forecast editions here.
      - ./documents:/app/documents:ro
      # Persist the vector store across rebuilds.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      # Generous: first boot indexes the corpus before serving.
      start_period: 180s
      retries: 3
    restart: unless-stopped